<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-assets>
            <audio id="knockAudio" src="knock_ater.mp3" preload="auto"></audio>
            <audio id="bgmAudio" src="sound.mp3" preload="auto"></audio>
        </a-assets>

        <a-camera>
            <a-cursor></a-cursor>
        </a-camera>

        <!-- Environment Planes -->
        <a-plane position="0 0 -5" height="5" width="5" color="pink"></a-plane>
        <a-plane position="0 -2.5 -5" rotation="-90 0 0" height="5" width="5" color="black"></a-plane>
        <a-plane position="-2.5 0 -5" rotation="0 90 0" height="5" width="5" color="yellow"></a-plane>

        <!-- Clickable Box -->
        <a-box position="0 2 -2" height="5" width="5" depth="5" color="black" sound="src: #knockAudio; on: click; volume: 1"></a-box>

        <!-- Background Music Entity (Fixed syntax and changed ID to avoid duplication) -->
        
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.querySelector('a-scene');
            const musicPlayer = document.querySelector('#bgmPlayer');

            const startMusic = () => {
                // Ensure the sound component is fully initialized before playing
                if (musicPlayer.components.sound) {
                    musicPlayer.components.sound.playSound();
                }
            };

            // Triggers audio play upon the first user interaction to bypass browser autoplay policies
            scene.addEventListener('mousemove', startMusic, { once: true });
            window.addEventListener('touchstart', startMusic, { once: true });
        });
    </script>
</body>
</html>
